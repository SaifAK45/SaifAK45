        fill="#E5E7EB">10.60%</text>

  <!-- subtle footer -->
  <line x1="28" y1="190" x2="472" y2="190" stroke="#172033" stroke-width="1"/>
  <text x="28" y="214"
        font-family="monospace"
        font-size="11"
        fill="#64748B">repository language distribution</text>
