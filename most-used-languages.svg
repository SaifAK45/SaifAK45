<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240">
  <rect width="500" height="240" rx="6" fill="#0A101F"/>

  <text x="28" y="39"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#22D3EE">Most Used Languages</text>

  <!-- Language distribution bar -->
  <rect x="28" y="64" width="444" height="10" rx="5" fill="#172033"/>
  <rect x="28" y="64" width="279.4" height="10" rx="5" fill="#3776AB"/>
  <rect x="307.4" y="64" width="66.4" height="10" fill="#F1E05A"/>
  <rect x="373.8" y="64" width="51.1" height="10" fill="#E34C26"/>
  <rect x="424.9" y="64" width="47.1" height="10" rx="5" fill="#663399"/>

  <!-- Python -->
  <circle cx="31" cy="108" r="6" fill="#3776AB"/>
  <text x="45" y="113"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#94A3B8">Python</text>
  <text x="165" y="113"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="600"
        fill="#E5E7EB">62.93%</text>

  <!-- JavaScript -->
  <circle cx="270" cy="108" r="6" fill="#F1E05A"/>
  <text x="284" y="113"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#94A3B8">JavaScript</text>
  <text x="405" y="113"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="600"
        fill="#E5E7EB">11.53%</text>

  <!-- HTML -->
  <circle cx="31" cy="147" r="6" fill="#E34C26"/>
  <text x="45" y="152"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#94A3B8">HTML</text>
  <text x="165" y="152"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="600"
        fill="#E5E7EB">14.95%</text>

  <!-- CSS -->
  <circle cx="270" cy="147" r="6" fill="#663399"/>
  <text x="284" y="152"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#94A3B8">CSS</text>
  <text x="405" y="152"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
