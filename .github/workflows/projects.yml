name: Generate Projects Panel

on:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - "logos/**"
      - ".github/scripts/generate_projects.py"
      - ".github/scripts/fetch_data.py"

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      # ==========================================
      # Checkout repository
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Fetch live GitHub repository information
      # ==========================================

      - name: Fetch live repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/fetch_data.py

      # ==========================================
      # Generate project SVGs
      # ==========================================

      - name: Generate projects SVG
        run: |
          mkdir -p out
          python3 .github/scripts/generate_projects.py merged.json out

      # ==========================================
      # Publish generated SVGs
      # ==========================================

      - name: Push to projects branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: projects
          build_dir: out
          commit_message: "Update projects panel [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}